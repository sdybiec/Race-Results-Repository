name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-latest

    # Run the full test suite against each database. The suite boots with Flyway
    # migrations + ddl-auto=validate (see src/test/resources/application-test.properties),
    # so a migration that drifts from the entities fails the matching axis.
    strategy:
      fail-fast: false
      matrix:
        database: [h2, mariadb]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # MariaDB is started only for the mariadb axis, so the h2 axis stays fully
      # independent of container/network availability.
      - name: Start MariaDB
        if: matrix.database == 'mariadb'
        run: |
          docker run -d --name mariadb \
            -e MARIADB_DATABASE=race_results_test \
            -e MARIADB_USER=race_test \
            -e MARIADB_PASSWORD=race_test_pw \
            -e MARIADB_ROOT_PASSWORD=root_pw \
            -p 3306:3306 \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=30 \
            mariadb:11
          echo "Waiting for MariaDB to become healthy..."
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mariadb 2>/dev/null || echo starting)
            echo "  attempt $i: $status"
            if [ "$status" = "healthy" ]; then echo "MariaDB is ready"; exit 0; fi
            sleep 3
          done
          echo "MariaDB did not become healthy in time"; docker logs mariadb; exit 1

      - name: Run test suite
        run: mvn -B -ntp verify
        env:
          TEST_DB_URL: ${{ matrix.database == 'mariadb' && 'jdbc:mariadb://127.0.0.1:3306/race_results_test' || 'jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE' }}
          TEST_DB_DRIVER: ${{ matrix.database == 'mariadb' && 'org.mariadb.jdbc.Driver' || 'org.h2.Driver' }}
          TEST_DB_USER: ${{ matrix.database == 'mariadb' && 'race_test' || 'sa' }}
          TEST_DB_PASSWORD: ${{ matrix.database == 'mariadb' && 'race_test_pw' || '' }}
          TEST_DB_DIALECT: ${{ matrix.database == 'mariadb' && 'org.hibernate.dialect.MariaDBDialect' || 'org.hibernate.dialect.H2Dialect' }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.database }}
          path: target/surefire-reports/**
          if-no-files-found: ignore
