# Test Application Configuration
#
# The datasource is env-driven so the same suite can run against multiple
# databases (see the CI matrix in .github/workflows/ci.yml). It defaults to an
# in-memory H2 database, so `mvn test` needs no external services.
#
# Tests run against the REAL Flyway migrations (spring.flyway.enabled=true) with
# ddl-auto=validate, so a migration that drifts from the entities fails the build
# on whichever database it drifted on. The Flyway {vendor} placeholder selects
# db/migration/h2 or db/migration/mariadb automatically from the connection.

# Datasource (override via TEST_DB_* env vars; H2 in-memory by default)
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USER:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}

# JPA: validate the entities against the Flyway-managed schema.
# Dialect defaults to H2; the MariaDB CI axis sets TEST_DB_DIALECT. (Required
# because the base application.properties defaults the dialect to MariaDB.)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${TEST_DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Run the real per-vendor migrations.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/{vendor}

# JWT Configuration (test keys)
jwt.secret=test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-to-work-properly
jwt.expiration=3600000

# MQTT Configuration (disabled for tests)
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=test-client
mqtt.username=
mqtt.password=
mqtt.topic.prefix=regatta

# Webhook Configuration
webhook.retry.max-attempts=3
webhook.retry.initial-delay=100
webhook.timeout=1000

# Backup Configuration
backup.directory=target/test-backups
backup.retention.days=7
backup.schedule.full=0 0 2 * * *
backup.schedule.incremental=0 0 */4 * * *

# Rate Limiting (relaxed for tests)
rate.limit.read.requests=1000
rate.limit.read.duration=60
rate.limit.write.requests=200
rate.limit.write.duration=60
rate.limit.search.requests=300
rate.limit.search.duration=60

# Disable scheduling for tests
spring.task.scheduling.enabled=false

# Logging
logging.level.org.rowtown.rms.rrr=DEBUG
logging.level.org.springframework.test=INFO
