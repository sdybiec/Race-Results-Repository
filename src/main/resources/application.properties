# Application Settings
spring.application.name=race-results-repository
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/race_results?createDatabaseIfNotExist=true
spring.datasource.username=race_results_user
spring.datasource.password=change_me_in_production
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Use @Column names verbatim as physical column names. Without this, Spring Boot's
# default CamelCaseToUnderscoresNamingStrategy rewrites camelCase @Column names
# (e.g. regattaId -> regatta_id), which would not match the schema created by the
# Flyway migrations and fail ddl-auto=validate on every database.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway Migration
# {vendor} resolves to the database engine (e.g. "mariadb", "h2"), selecting the
# matching per-vendor migration directory under db/migration/.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/{vendor}

# JWT Configuration
jwt.secret=your-256-bit-secret-key-change-in-production-must-be-very-long
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# MQTT Configuration
# Option 1: External MQTT broker (recommended for production)
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=race-results-repository
mqtt.username=
mqtt.password=
mqtt.topic.prefix=regatta

# Option 2: Embedded MQTT broker (for development/single-server deployments)
# Set mqtt.embedded.enabled=true to use embedded Moquette broker
# See application-embedded.yml for embedded broker configuration
mqtt.embedded.enabled=false

# Webhook Configuration
webhook.retry.max-attempts=5
webhook.retry.initial-delay=2000
webhook.retry.max-delay=16000
webhook.timeout=5000

# Backup Configuration
backup.directory=/var/backups/race-results
backup.schedule.full=0 0 2 * * *
backup.schedule.incremental=0 0 */4 * * *
backup.retention.days=30

# Rate Limiting
rate.limit.read.requests=100
rate.limit.read.duration=60
rate.limit.write.requests=20
rate.limit.write.duration=60
rate.limit.search.requests=30
rate.limit.search.duration=60

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=documents,versions,search-results

# Logging
logging.level.root=INFO
logging.level.org.rowtown.rms.rrr=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# TDI Model Validation (see docs/tdi-model-integration.md)
# Fail-fast: a model the generated TDI classes cannot load is unusable in the
# timing system, so it is rejected at ingest (HTTP 400) rather than stored.
# enabled: reject payloads that the generated TDI classes cannot load.
# strict:  additionally reject models that load but have EMF ERROR-level problems
#          (e.g. omitted required fields). Leave off unless producers emit
#          fully-populated models.
rrr.tdi.validation.enabled=true
rrr.tdi.validation.strict=false
