# OpenAPI Spec Generation Profile
#
# Boots the application with an in-memory H2 database whose schema is generated
# by Hibernate (Flyway disabled) purely so the live /api-docs endpoint can be
# exported to a static file. No external services (MariaDB, MQTT) are required.
#
# Activated automatically by the "openapi" Maven profile:
#     mvn verify -Popenapi
#
# H2 runs in MySQL compatibility mode so the entity columnDefinitions
# (LONGBLOB, TEXT, JSON) are understood when Hibernate generates the schema.

spring:
  # In-memory H2 in MySQL compatibility mode
  datasource:
    url: jdbc:h2:mem:race_results_openapi;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Let Hibernate build the schema from the entities instead of Flyway.
  # The production Flyway migrations use MariaDB-specific syntax (prefix
  # indexes, ENGINE/CHARSET clauses) that H2 cannot execute.
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Skip Flyway entirely for spec generation
  flyway:
    enabled: false

# No MQTT broker is needed; MqttPublishingService degrades gracefully and only
# logs a warning if it cannot connect, so context startup is unaffected.
mqtt:
  embedded:
    enabled: false
