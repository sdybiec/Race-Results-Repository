# Production profile for a single-node / embedded deployment backed by H2.
#
# Activate with:  --spring.profiles.active=prod-h2
#
# This profile layers over application.properties and overrides only the
# database-specific settings. It uses a FILE-BASED (persistent) H2 database in
# native mode (no MySQL compatibility crutch) whose schema is managed by the
# per-vendor Flyway migrations in db/migration/h2.
#
# Intended for single-node/embedded installs only. H2 is a single-writer engine
# and is not suitable for multi-instance / high-availability deployments.

spring:
  datasource:
    # File-based H2 for durability across restarts.
    #   DB_PATH        - directory + base filename for the database files
    #   AUTO_SERVER    - allow a second local process (e.g. tooling) to attach
    #   DATABASE_TO_LOWER - fold unquoted identifiers to lower case, matching the
    #                       snake_case / camelCase column names used by the schema
    url: jdbc:h2:file:${DB_PATH:/var/lib/race-results/db/race_results};AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # H2 is single-writer; a small pool avoids lock contention.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false

  # Per-vendor migrations; {vendor} resolves to "h2" for this datasource.
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/{vendor}

  # The H2 web console must never be enabled in production.
  h2:
    console:
      enabled: false
